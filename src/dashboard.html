<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stremio Watch Tracker — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #151720;
      --card-hover: #1c1f2c;
      --accent: #7c5cff;
      --accent-hover: #6842ff;
      --danger: #ff4757;
      --text: #e1e1e6;
      --text-muted: #8a8d9b;
      --border: #232736;
      --success: #2ed573;
      --star: #ffc107;
      --movie-color: #2ed573;
      --series-color: #7c5cff;
      --anime-color: #ff4757;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background: rgba(21, 23, 32, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .logo-icon {
      background: var(--accent);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .nav-tabs {
      display: flex;
      background: #0b0c10;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    main {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 24px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 4px;
      min-width: 44px;
    }
    .filter-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .filter-pill:hover { border-color: #383e56; color: var(--text); }
    .filter-pill.active { color: #fff; border-color: transparent; }
    .filter-pill.active.fp-all    { background: var(--accent); }
    .filter-pill.active.fp-movie  { background: var(--movie-color); color: #000; }
    .filter-pill.active.fp-series { background: var(--series-color); }
    .filter-pill.active.fp-anime  { background: var(--anime-color); }

    .genre-bar {
      margin-bottom: 16px;
    }
    .genre-pill {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .genre-pill:hover { border-color: #383e56; color: var(--text); }
    .genre-pill.active { background: var(--accent); color: #fff; border-color: transparent; }

    .pill-count {
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      width: 300px;
      max-width: 100%;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #383e56;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      padding-top: 145%;
      background: #10121a;
      cursor: pointer;
    }
    .poster-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    .poster-fallback {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: var(--border);
    }

    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    .badge-anime  { background: rgba(255, 71, 87, 0.9); }
    .badge-movie  { background: rgba(46, 213, 115, 0.9); color: #000; }
    .badge-series { background: rgba(124, 92, 255, 0.9); }

    .hide-btn-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(11, 12, 16, 0.85);
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.15);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 5;
    }
    .hide-btn-overlay:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
      transform: scale(1.1);
    }

    .card-content {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.3;
      cursor: pointer;
    }
    .card-title:hover { color: var(--accent); }

    .card-reason {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 10px;
      flex: 1;
      font-style: italic;
    }

    .seen-tag {
      font-size: 10px;
      color: #ff9f43;
      font-weight: 500;
      margin-top: 2px;
      font-style: normal;
    }

    .star-rating {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin: 4px 0 8px;
    }
    .star-icon {
      font-size: 15px;
      color: #383e56;
      cursor: pointer;
      transition: color 0.15s, transform 0.15s;
      user-select: none;
    }
    .star-icon.filled { color: var(--star); }
    .star-icon:hover { transform: scale(1.2); color: var(--star); }

    .card-actions {
      display: flex;
      gap: 4px;
      margin-top: auto;
    }

    .action-btn {
      flex: 1;
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1b1e2b;
      color: var(--text);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      text-align: center;
    }
    .action-btn:hover { background: #252a3d; }
    .action-btn-watched:hover { background: var(--success); border-color: var(--success); color: #000; }
    .action-btn-towatch:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .action-btn-dismiss:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state .empty-msg { font-size: 14px; }
    .status-text { font-size: 12px; color: var(--text-muted); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }
    .modal-backdrop {
      width: 100%;
      height: 200px;
      background-size: cover;
      background-position: center;
      position: relative;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .modal-backdrop-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(21,23,32,0.2) 0%, rgba(21,23,32,1) 100%);
    }
    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-body {
      padding: 20px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .modal-title { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2; }
    .modal-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 10px; align-items: center; margin-top: 4px; }
    .modal-overview { font-size: 13px; color: var(--text); line-height: 1.55; }
    .modal-genres { display: flex; flex-wrap: wrap; gap: 6px; }
    .genre-tag { background: #232736; color: var(--text-muted); font-size: 11px; padding: 4px 10px; border-radius: 12px; }
    .modal-trailer-btn {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      width: fit-content;
      transition: background 0.2s;
    }
    .modal-trailer-btn:hover { background: #cc0000; }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #10121a;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
    }
    .search-result-poster {
      width: 44px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--card-bg);
      flex-shrink: 0;
    }
    .search-result-info {
      flex: 1;
      overflow: hidden;
    }
    .search-result-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-result-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ---- Dedicated Mobile Optimization (< 600px) ---- */
    @media (max-width: 600px) {
      header {
        padding: 10px 12px;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .logo { font-size: 16px; }
      .logo-icon { width: 28px; height: 28px; font-size: 14px; }
      
      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .header-actions {
        gap: 6px;
      }
      .header-actions .btn {
        padding: 6px 10px;
        font-size: 11px;
      }

      .nav-tabs {
        width: 100%;
        justify-content: space-between;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .tab-btn {
        flex: 1;
        padding: 7px 4px;
        font-size: 11px;
        text-align: center;
        white-space: nowrap;
      }

      main { padding: 0 10px; margin: 12px auto; }
      
      .filter-bar {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
        margin-bottom: 8px;
      }
      .filter-label { min-width: 40px; font-size: 11px; }
      .filter-pill, .genre-pill { padding: 4px 10px; font-size: 11px; }

      .toolbar { margin-bottom: 12px; gap: 8px; }
      .search-input { width: 100%; padding: 8px 12px; font-size: 13px; }
      .status-text { font-size: 11px; }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .poster-wrapper { padding-top: 135%; }
      .card-content { padding: 8px 8px 10px; }
      .card-title { font-size: 11px; margin-bottom: 4px; }
      .card-reason {
        font-size: 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .star-icon { font-size: 13px; }

      /* Mobile 2-column card actions grid */
      .card-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .card-actions .action-btn-watched {
        grid-column: 1 / -1;
      }
      .action-btn {
        padding: 6px 2px;
        font-size: 10px;
      }

      /* Mobile Modals */
      .modal-card { width: 95%; max-height: 92vh; border-radius: 12px; }
      .modal-body { padding: 14px; gap: 10px; }
      .modal-backdrop { height: 140px; }
      .modal-title { font-size: 16px; }
      .modal-meta { font-size: 11px; gap: 6px; flex-wrap: wrap; }
      .modal-overview { font-size: 12px; line-height: 1.45; }
      .modal-actions-row {
        flex-direction: column;
        align-items: stretch !important;
        gap: 8px !important;
      }
      .modal-actions-row .btn,
      .modal-actions-row .modal-trailer-btn {
        width: 100% !important;
        justify-content: center;
      }

      .toast {
        left: 16px;
        right: 16px;
        bottom: 16px;
        text-align: center;
        padding: 10px 14px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">🍿</div>
        <span>Watch Tracker</span>
      </div>

      <div class="header-actions">
        <button class="btn" style="background: var(--success); color: #000;" onclick="openAddTitleModal()">
          <span>➕</span> Add Title
        </button>
        <button class="btn" id="refresh-btn" onclick="triggerRefresh()">
          <span>🔄</span> Refresh
        </button>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-recs" onclick="switchTab('recs', event)">💡 Recommendations (<span id="recs-count">0</span>)</button>
      <button class="tab-btn" id="tab-towatch" onclick="switchTab('towatch', event)">📌 To Watch (<span id="towatch-count">0</span>)</button>
      <button class="tab-btn" id="tab-history" onclick="switchTab('history', event)">📊 History (<span id="history-count">0</span>)</button>
    </div>
  </header>

  <main>
    <!-- Type filter pills -->
    <div class="filter-bar" id="filter-bar">
      <span class="filter-label">Type:</span>
      <button class="filter-pill fp-all active" id="pill-all"    onclick="setFilter('all',    event)">All <span class="pill-count" id="count-all">0</span></button>
      <button class="filter-pill fp-movie"      id="pill-movie"  onclick="setFilter('movie',  event)">🎬 Movies <span class="pill-count" id="count-movie">0</span></button>
      <button class="filter-pill fp-series"     id="pill-series" onclick="setFilter('series', event)">📺 Series <span class="pill-count" id="count-series">0</span></button>
      <button class="filter-pill fp-anime"      id="pill-anime"  onclick="setFilter('anime',  event)">🌸 Anime <span class="pill-count" id="count-anime">0</span></button>
    </div>

    <!-- Dynamic Genre filter pills -->
    <div class="filter-bar genre-bar" id="genre-bar">
      <span class="filter-label">Genre:</span>
      <button class="genre-pill active" id="genre-pill-all" onclick="setGenre('all', event)">All Genres</button>
      <!-- Populated dynamically -->
    </div>

    <div class="toolbar">
      <input type="text" class="search-input" id="search-box" placeholder="Filter by title..." oninput="renderGrid()">
      <div class="status-text" id="status-info">Dashboard Active</div>
    </div>

    <div class="grid" id="content-grid"></div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detail-modal" onclick="closeModalOnOverlay(event)">
    <div class="modal-card" id="modal-card-content">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <div id="modal-inner">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Add Title Modal -->
  <div class="modal-overlay" id="add-title-modal" onclick="closeAddModalOnOverlay(event)">
    <div class="modal-card" style="max-width: 580px; padding: 24px;">
      <button class="modal-close-btn" onclick="closeAddModal()">✕</button>
      <h3 style="color: #fff; font-size: 18px; margin-bottom: 14px;">➕ Add Title to Watchlist</h3>
      <input type="text" class="search-input" id="add-search-box" style="width: 100%; margin-bottom: 16px;" placeholder="Search TMDB for movies, series, or anime..." oninput="debouncedSearchTitles()">
      <div id="add-search-results" style="display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto;">
        <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px;">Type a title above to search TMDB...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SECRET = window.location.pathname.split('/')[1];
    const API_BASE = `/${SECRET}/api`;

    let allRecs    = [];
    let allToWatch = [];
    let allHistory = [];
    let currentTab    = 'recs';
    let currentFilter = 'all';
    let currentGenre  = 'all';
    const pingedInSession = new Set();
    let searchDebounceTimer = null;

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3200);
    }

    // ---- Data loading ----
    async function loadData() {
      try {
        const [recsRes, towatchRes, historyRes] = await Promise.all([
          fetch(`${API_BASE}/recommendations`),
          fetch(`${API_BASE}/towatch`),
          fetch(`${API_BASE}/history`),
        ]);

        allRecs    = await recsRes.json();
        allToWatch = await towatchRes.json();
        allHistory = await historyRes.json();

        document.getElementById('recs-count').textContent    = allRecs.length;
        document.getElementById('towatch-count').textContent = allToWatch.length;
        document.getElementById('history-count').textContent = allHistory.length;

        updatePillCounts();
        renderGenrePills();
        renderGrid();
      } catch (err) {
        showToast('Failed to load data: ' + err.message);
      }
    }

    function switchTab(tab, e) {
      currentTab = tab;
      currentGenre = 'all';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      updatePillCounts();
      renderGenrePills();
      renderGrid();
    }

    function setFilter(filter, e) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      renderGenrePills();
      renderGrid();
    }

    function setGenre(genre, e) {
      currentGenre = genre;
      document.querySelectorAll('.genre-pill').forEach(p => p.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      renderGrid();
    }

    function categorise(item) {
      if (item.is_anime === 1) return 'anime';
      return item.type === 'movie' ? 'movie' : 'series';
    }

    function getActiveItems() {
      if (currentTab === 'recs') return allRecs;
      if (currentTab === 'towatch') return allToWatch;
      return allHistory;
    }

    function updatePillCounts() {
      const items = getActiveItems();
      const counts = { all: items.length, movie: 0, series: 0, anime: 0 };
      for (const item of items) counts[categorise(item)]++;
      document.getElementById('count-all').textContent    = counts.all;
      document.getElementById('count-movie').textContent  = counts.movie;
      document.getElementById('count-series').textContent = counts.series;
      document.getElementById('count-anime').textContent  = counts.anime;
    }

    function renderGenrePills() {
      const genreBar = document.getElementById('genre-bar');
      genreBar.innerHTML = `<span class="filter-label">Genre:</span>
        <button class="genre-pill ${currentGenre === 'all' ? 'active' : ''}" onclick="setGenre('all', event)">All Genres</button>`;

      let items = getActiveItems();
      if (currentFilter !== 'all') {
        items = items.filter(i => categorise(i) === currentFilter);
      }

      const genreMap = {};
      for (const item of items) {
        if (!item.genres) continue;
        const gList = item.genres.split(',').map(g => g.trim()).filter(Boolean);
        for (const g of gList) {
          genreMap[g] = (genreMap[g] || 0) + 1;
        }
      }

      const sortedGenres = Object.entries(genreMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 15);

      for (const [gName, count] of sortedGenres) {
        const btn = document.createElement('button');
        btn.className = `genre-pill ${currentGenre === gName ? 'active' : ''}`;
        btn.innerHTML = `${esc(gName)} <span style="opacity: 0.6; font-size: 10px;">(${count})</span>`;
        btn.onclick = (e) => setGenre(gName, e);
        genreBar.appendChild(btn);
      }
    }

    function renderStarsHtml(imdbId, currentRating = 0) {
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        const isFilled = i <= (currentRating || 0) ? 'filled' : '';
        stars += `<span class="star-icon ${isFilled}" onclick="rateItem('${esc(imdbId)}', ${i}, event)">★</span>`;
      }
      return `<div class="star-rating">${stars}</div>`;
    }

    async function rateItem(imdbId, rating, event) {
      if (event) event.stopPropagation();
      try {
        await fetch(`${API_BASE}/rate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imdbId, rating }),
        });
        showToast(`Saved ${rating}-star rating! ⭐`);
        const item = [...allRecs, ...allToWatch, ...allHistory].find(i => i.imdb_id === imdbId);
        if (item) {
          item.rating = rating;
          item.impressions = 0;
        }
        renderGrid();
      } catch (err) {
        showToast('Failed to save rating: ' + err.message);
      }
    }

    function renderGrid() {
      const query = document.getElementById('search-box').value.toLowerCase();
      const grid  = document.getElementById('content-grid');
      grid.innerHTML = '';

      let items = getActiveItems();

      if (currentFilter !== 'all') {
        items = items.filter(i => categorise(i) === currentFilter);
      }

      if (currentGenre !== 'all') {
        items = items.filter(i => i.genres && i.genres.toLowerCase().includes(currentGenre.toLowerCase()));
      }

      if (query) {
        items = items.filter(i => (i.title || i.imdb_id).toLowerCase().includes(query));
      }

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <div class="empty-msg">No items found for this filter.</div>
          </div>`;
        return;
      }

      document.getElementById('status-info').textContent = `Showing ${items.length} item${items.length !== 1 ? 's' : ''}`;

      const visibleIdsToPing = [];

      for (let index = 0; index < items.length; index++) {
        const item = items[index];
        const cat = categorise(item);
        const badgeClass = cat === 'anime' ? 'badge-anime' : (cat === 'movie' ? 'badge-movie' : 'badge-series');
        const badgeLabel = cat === 'anime' ? 'Anime' : (cat === 'movie' ? 'Movie' : 'Series');

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${item.imdb_id}`;

        const posterHtml = item.poster
          ? `<img class="poster-img" src="${esc(item.poster)}" alt="${esc(item.title)}" loading="lazy">`
          : `<div class="poster-fallback">🎬</div>`;

        const hideOverlayHtml = currentTab === 'recs'
          ? `<button class="hide-btn-overlay" title="Not Interested / Hide" onclick="hideItem('${esc(item.imdb_id)}', '${esc(item.title)}', event)">✕</button>`
          : '';

        let actionsHtml = '';
        if (currentTab === 'recs') {
          actionsHtml = `
            <button class="action-btn action-btn-watched" onclick="markWatched('${esc(item.imdb_id)}', '${esc(item.type)}')">✓ Watched</button>
            <button class="action-btn action-btn-towatch" onclick="saveToWatchFromObj('${esc(item.imdb_id)}', '${esc(item.type)}')">📌 To Watch</button>
            <button class="action-btn action-btn-dismiss" onclick="hideItem('${esc(item.imdb_id)}', '${esc(item.title)}', event)">✕ Hide</button>`;
        } else if (currentTab === 'towatch') {
          actionsHtml = `
            <button class="action-btn action-btn-watched" onclick="markWatched('${esc(item.imdb_id)}', '${esc(item.type)}')">✓ Watched</button>
            <button class="action-btn action-btn-dismiss" onclick="removeHistory('${esc(item.imdb_id)}')">Remove</button>`;
        } else {
          actionsHtml = `<button class="action-btn action-btn-dismiss" onclick="removeHistory('${esc(item.imdb_id)}')">Remove</button>`;
        }

        const seenTagHtml = (currentTab === 'recs' && item.impressions >= 3)
          ? `<div class="seen-tag">👁 Shown ${item.impressions} times</div>`
          : '';

        const reasonHtml = currentTab === 'recs'
          ? `<div class="card-reason">${esc(item.reason) || 'Recommended based on your watch history'}${seenTagHtml}</div>`
          : '';

        const starWidgetHtml = renderStarsHtml(item.imdb_id, item.rating || 0);

        card.innerHTML = `
          <div class="poster-wrapper" onclick="openDetailModal('${esc(item.imdb_id)}', '${esc(item.type)}')">
            ${hideOverlayHtml}
            ${posterHtml}
            <div class="badge ${badgeClass}">${badgeLabel}</div>
          </div>
          <div class="card-content">
            <div class="card-title" onclick="openDetailModal('${esc(item.imdb_id)}', '${esc(item.type)}')">${esc(item.title) || item.imdb_id}</div>
            ${reasonHtml}
            ${starWidgetHtml}
            <div class="card-actions">${actionsHtml}</div>
          </div>`;

        grid.appendChild(card);

        if (currentTab === 'recs' && index < 30 && !pingedInSession.has(item.imdb_id)) {
          visibleIdsToPing.push(item.imdb_id);
          pingedInSession.add(item.imdb_id);
        }
      }

      if (visibleIdsToPing.length > 0) {
        sendImpressionPing(visibleIdsToPing);
      }
    }

    async function sendImpressionPing(imdbIds) {
      try {
        await fetch(`${API_BASE}/impression`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imdbIds }),
        });
      } catch (_) {}
    }

    async function markWatched(imdbId, type) {
      document.getElementById(`card-${imdbId}`)?.remove();
      showToast('Marked as watched!');
      await fetch(`/${SECRET}/mark-watched`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imdbId, type }),
      });
      loadData();
    }

    async function saveToWatchFromObj(imdbId, type) {
      document.getElementById(`card-${imdbId}`)?.remove();
      const item = [...allRecs, ...allHistory].find(i => i.imdb_id === imdbId) || {};
      showToast('Saved to To-Watch list!');
      await fetch(`${API_BASE}/towatch`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          imdbId,
          type,
          title: item.title,
          poster: item.poster,
          isAnime: item.is_anime
        }),
      });
      loadData();
    }

    async function hideItem(imdbId, title, event) {
      if (event) event.stopPropagation();
      document.getElementById(`card-${imdbId}`)?.remove();
      allRecs = allRecs.filter(i => i.imdb_id !== imdbId);
      showToast('Item hidden persistently');
      await fetch(`${API_BASE}/hide`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imdbId, title }),
      });
      updatePillCounts();
      renderGenrePills();
      renderGrid();
    }

    async function removeHistory(imdbId) {
      document.getElementById(`card-${imdbId}`)?.remove();
      showToast('Removed from list');
      await fetch(`/${SECRET}/mark-watched`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imdbId }),
      });
      loadData();
    }

    async function triggerRefresh() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.innerHTML = `<div class="spinner"></div> Generating...`;

      try {
        const res  = await fetch(`${API_BASE}/recommend/refresh`, { method: 'POST' });
        const data = await res.json();
        showToast(data.message || 'Refresh triggered! Results appear in ~30s.');
        setTimeout(loadData, 5000);
      } catch (err) {
        showToast('Refresh failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>🔄</span> Refresh`;
      }
    }

    // ---- Add Title Modal & Search ----
    function openAddTitleModal() {
      document.getElementById('add-title-modal').classList.add('active');
      document.getElementById('add-search-box').focus();
    }

    function closeAddModal() {
      document.getElementById('add-title-modal').classList.remove('active');
    }

    function closeAddModalOnOverlay(e) {
      if (e.target.id === 'add-title-modal') closeAddModal();
    }

    function debouncedSearchTitles() {
      clearTimeout(searchDebounceTimer);
      const query = document.getElementById('add-search-box').value.trim();
      const resultsContainer = document.getElementById('add-search-results');

      if (!query) {
        resultsContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px;">Type a title above to search TMDB...</div>`;
        return;
      }

      resultsContainer.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--text-muted);"><div class="spinner" style="margin: 0 auto 8px;"></div> Searching...</div>`;

      searchDebounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
          if (!res.ok) throw new Error('Search failed');
          const data = await res.json();

          if (data.length === 0) {
            resultsContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px;">No results found on TMDB.</div>`;
            return;
          }

          resultsContainer.innerHTML = '';
          for (const item of data) {
            const div = document.createElement('div');
            div.className = 'search-result-item';

            const posterSrc = item.poster ? esc(item.poster) : '';
            const posterHtml = posterSrc
              ? `<img src="${posterSrc}" class="search-result-poster" alt="${esc(item.title)}">`
              : `<div class="search-result-poster" style="display:flex;align-items:center;justify-content:center;">🎬</div>`;

            const badgeLabel = item.isAnime ? 'Anime' : (item.type === 'movie' ? 'Movie' : 'Series');

            div.innerHTML = `
              ${posterHtml}
              <div class="search-result-info">
                <div class="search-result-title">${esc(item.title)}</div>
                <div class="search-result-meta">${esc(item.year || 'N/A')} • ${badgeLabel}</div>
              </div>
              <button class="btn" style="padding: 6px 12px; font-size: 12px; background: var(--accent);" onclick="addToWatchlist('${esc(item.imdbId)}', '${esc(item.type)}', ${item.tmdbId}, '${esc(item.title)}', '${esc(item.year)}', '${esc(item.poster)}', ${item.isAnime})">
                📌 To-Watch
              </button>`;

            resultsContainer.appendChild(div);
          }
        } catch (err) {
          resultsContainer.innerHTML = `<div style="color: var(--danger); font-size: 13px; text-align: center; padding: 20px;">Error searching: ${esc(err.message)}</div>`;
        }
      }, 300);
    }

    async function addToWatchlist(imdbId, type, tmdbId, title, year, poster, isAnime) {
      try {
        const res = await fetch(`${API_BASE}/towatch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imdbId, type, tmdbId, title, year, poster, isAnime }),
        });
        const data = await res.json();
        showToast(data.message || 'Saved to To-Watch list!');
        closeAddModal();
        loadData();
      } catch (err) {
        showToast('Failed to add title: ' + err.message);
      }
    }

    // ---- Detail Modal ----
    async function openDetailModal(imdbId, type) {
      const modal = document.getElementById('detail-modal');
      const inner = document.getElementById('modal-inner');
      inner.innerHTML = `
        <div style="padding: 40px; text-align: center; color: var(--text-muted);">
          <div class="spinner" style="margin: 0 auto 12px;"></div>
          Loading details...
        </div>`;
      modal.classList.add('active');

      try {
        const res = await fetch(`${API_BASE}/details/${type}/${encodeURIComponent(imdbId)}`);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }
        const data = await res.json();

        const backdropStyle = data.backdrop
          ? `background-image: url('${esc(data.backdrop)}');`
          : `background: #10121a;`;

        const trailerButton = data.trailerKey
          ? `<a class="modal-trailer-btn" href="https://www.youtube.com/watch?v=${esc(data.trailerKey)}" target="_blank" rel="noopener noreferrer">▶ Watch Trailer</a>`
          : `<a class="modal-trailer-btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent((data.title || '') + ' trailer')}" target="_blank" rel="noopener noreferrer">🔍 Search Trailer on YouTube</a>`;

        const genresHtml = (data.genres || []).map(g => `<span class="genre-tag">${esc(g)}</span>`).join('');

        inner.innerHTML = `
          <div class="modal-backdrop" style="${backdropStyle}">
            <div class="modal-backdrop-overlay"></div>
          </div>
          <div class="modal-body">
            <div class="modal-header-row">
              <div>
                <div class="modal-title">${esc(data.title)}</div>
                <div class="modal-meta">
                  <span>${esc(data.year)}</span>
                  <span>•</span>
                  <span>⭐ ${esc(data.voteAverage)} (${data.voteCount} votes)</span>
                  <span>•</span>
                  <span style="text-transform: capitalize;">${esc(data.type)}</span>
                </div>
              </div>
            </div>

            <div class="modal-genres">${genresHtml}</div>

            <div class="modal-overview">${esc(data.overview)}</div>

            <div>
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px;">Your Rating:</div>
              ${renderStarsHtml(imdbId, data.rating || 0)}
            </div>

            <div class="modal-actions-row" style="display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap;">
              ${trailerButton}
              <button class="btn" style="background: var(--accent); color: #fff;" onclick="saveToWatchFromObj('${esc(imdbId)}', '${esc(type)}'); closeModal();">📌 Save to To-Watch</button>
              <button class="btn" style="background: var(--success); color: #000;" onclick="markWatched('${esc(imdbId)}', '${esc(type)}'); closeModal();">✓ Mark Watched</button>
            </div>
          </div>`;
      } catch (err) {
        inner.innerHTML = `
          <div style="padding: 30px; text-align: center; color: var(--danger);">
            Failed to load details: ${esc(err.message)}
          </div>`;
      }
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'detail-modal') closeModal();
    }

    loadData();
  </script>
</body>
</html>
