name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare connection variables
        id: vars
        run: |
          SSH_USER="${{ secrets.VPS_USERNAME }}"
          if [ -z "$SSH_USER" ]; then SSH_USER="root"; fi
          echo "VPS_USER=$SSH_USER" >> $GITHUB_ENV

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT="22"; fi
          echo "VPS_PORT=$SSH_PORT" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ env.VPS_PORT }}
          script: |
            cd ~/stremio-tracker
            git remote set-url origin https://github.com/nisargnegi/stremio-tracker.git
            git fetch --all
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build
